<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete | Sansfrontieres</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .auth-card {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .logo {
            margin-bottom: 10px;
            font-size: 26px;
            font-weight: bold;
        }

        .subtitle {
            margin-bottom: 30px;
            color: #666;
        }

        h1 {
            margin-bottom: 15px;
        }

        p {
            color: #555;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .button {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 6px;
            background: #222;
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        .button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

<div class="auth-container">
    <div class="auth-card">

        <div class="logo">
            SANSFRONTIERES
        </div>

        <div class="subtitle">
            Chat Moderation Management System
        </div>

        <h1>Password Reset Complete</h1>

        <p>
            Your password has been reset successfully.
            You can now sign in with your new password.
        </p>

        <a href="{% url 'accounts:login' %}" class="button">
            Sign In
        </a>

    </div>
</div>

</body>
</html>
